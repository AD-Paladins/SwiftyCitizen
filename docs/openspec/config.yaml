# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: iOS app, Swift 6 / SwiftUI, SwiftData persistence, Xcode 27, deployment target iOS 27.0.
  Architecture: hexagonal — pure domain (Core/Domain, `import Foundation` only) under Core/,
    SwiftData models in Core/Persistence/Models, SwiftUI views in Features/.
  Testing: XCTest via xcodebuild; unit tests in SwiftyCitizenTests target (252 tests).
  Style: English artifacts, Conventional Commits, Localizable.xcstrings (source = en).
  Repo rule: PBXFileSystemSynchronizedRootGroup — never edit project.pbxproj manually.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - For SwiftData schema changes, include a migration strategy section
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (domain-first; pure domain files import Foundation only)
      - SwiftData model/schema changes must pair with a migration plan and update docs/architecture/data-and-persistence.md
    tdd: true
    test_command: "xcodebuild test -project SwiftyCitizen.xcodeproj -scheme SwiftyCitizen -destination 'platform=iOS Simulator,id=9CC72DE8-ED58-4D07-B736-C9B4B6750139' -parallel-testing-enabled NO -only-testing:SwiftyCitizenTests"
  verify:
    test_command: "xcodebuild test -project SwiftyCitizen.xcodeproj -scheme SwiftyCitizen -destination 'platform=iOS Simulator,id=9CC72DE8-ED58-4D07-B736-C9B4B6750139' -parallel-testing-enabled NO -only-testing:SwiftyCitizenTests"
    build_command: "xcodebuild build -project SwiftyCitizen.xcodeproj -scheme SwiftyCitizen -destination 'platform=iOS Simulator,id=9CC72DE8-ED58-4D07-B736-C9B4B6750139'"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
